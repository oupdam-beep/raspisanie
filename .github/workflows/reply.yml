name: Reply to dates

on:
  schedule:
    - cron: "*/5 * * * *"   # новый запуск каждые 5 минут, каждый слушает ~4,5 минуты
  workflow_dispatch:

concurrency:
  group: reply
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python reply.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SCHEDULE_URL: ${{ vars.SCHEDULE_URL }}
